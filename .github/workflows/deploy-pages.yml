name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 部署整个仓库：README 里的预览链接指向 /waimai-preview/ 与 /csv-dashboard/
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify key pages are reachable and correct
        if: steps.deployment.outputs.page_url != ''
        run: |
          set -e
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}/"
          echo "Expected Pages base URL: $BASE"

          # 从 BASE 提取仓库路径段（如 /QQQuan2/），用于校验 README 中的公开链接
          REPO_PATH=$(echo "$BASE" | sed -E 's|https?://[^/]+||')
          echo "Repo subpath: \"$REPO_PATH\""

          fetch() {
            url="$1"
            for i in 1 2 3 4 5 6; do
              code=$(curl -sL -o /tmp/page.html -w "%{http_code}" "$url" || true)
              echo "  [$url] attempt $i: HTTP $code"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 15
            done
            echo "ERROR: $url did not return 200 after 6 attempts (last code: $code)"
            echo "常见原因："
            echo "  1. 仓库 Settings -> Pages -> Source 不是 GitHub Actions"
            echo "  2. 仓库被重命名/删除，导致 Pages URL 变化"
            echo "  3. 部署 artifact 为空或路径错误"
            return 1
          }

          assert_contains() {
            file="$1"; needle="$2"; label="$3"
            if grep -q "$needle" "$file"; then
              echo "  OK: $label"
            else
              echo "  ERROR: $label —— 页面缺少预期内容 '$needle'"
              return 1
            fi
          }

          # 1) 关键页面必须可访问
          fetch "${BASE}"
          cp /tmp/page.html /tmp/home.html
          fetch "${BASE}waimai-preview/"
          cp /tmp/page.html /tmp/preview.html
          fetch "${BASE}waimai-preview/demo/"
          fetch "${BASE}csv-dashboard/"
          fetch "${BASE}404.html"

          # 2) 页面内容必须正确
          assert_contains /tmp/home.html "作品集" "首页渲染了作品集页面"
          assert_contains /tmp/preview.html "外卖配送系统" "预览页渲染了外卖系统页面"

          # 3) 首页根目录有 .nojekyll 文件
          fetch "${BASE}.nojekyll"
          echo "  OK: .nojekyll 可访问（Jekyll 已被禁用，_ 开头的文件夹不会被吃掉）"

          # 4) 不允许再出现已失效的旧路径
          for f in /tmp/home.html /tmp/preview.html; do
            if grep -q "InventoRY" "$f"; then
              echo "  ERROR: $f 中仍残留失效的旧链接 InventoRY"
              exit 1
            fi
          done
          echo "  OK: 无残留旧链接 InventoRY"

          # 5) 验证 README 里的公开链接跟实际部署路径一致
          echo ""
          echo "--- README 链接校验 ---"
          README_URLS=$(curl -sL "https://raw.githubusercontent.com/QQQuan2/QQQuan2/main/README.md" | grep -oE 'https://qqquan2\.github\.io[^"'"'"' )]+' || true)
          if [ -z "$README_URLS" ]; then
            echo "  WARN: 没从 README 提取到 Pages 链接，跳过校验"
          else
            ALL_OK=true
            echo "$README_URLS" | sort -u | while IFS= read -r url; do
              # 去掉尾部 /
              clean="${url%/}"
              code=$(curl -sL -o /dev/null -w "%{http_code}" "$clean" || true)
              if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
                echo "  ✓ $clean  → $code"
              else
                echo "  ✗ $clean  → $code（可能需要加 /QQQuan2/ 前缀）"
                ALL_OK=false
              fi
            done
            if [ "$ALL_OK" = "true" ]; then
              echo "  OK: 所有公开链接均可达"
            else
              echo "  ERROR: 有链接返回非 200，请检查 README 中的 URL"
              exit 1
            fi
          fi

          echo ""
          echo "All key pages are reachable and verified."
