<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 页面不存在</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f7f8fa; color: #1f2937; padding: 24px;
    }
    .box { max-width: 520px; text-align: center; }
    h1 { font-size: 80px; color: #ff6b1a; margin-bottom: 8px; }
    h2 { font-size: 22px; margin-bottom: 16px; }
    p { color: #6b7280; line-height: 1.8; margin-bottom: 28px; }
    a { display: inline-block; padding: 12px 28px; border-radius: 999px; background: #ff6b1a; color: #fff; text-decoration: none; font-weight: 600; }
    a:hover { background: #e55a10; }
    .hint { margin-top: 24px; font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>这里还没有内容</h2>
    <p>你访问的页面可能尚未部署，或者地址拼写有误。<br>如果刚修改过 GitHub Pages 设置，请等待 1-2 分钟后刷新。</p>
    <a id="homeLink" href="/QQQuan2/">返回作品集首页</a>
    <p class="hint">仓库地址：<span id="repoHint">github.com/QQQuan2/QQQuan2</span></p>
  </div>
  <script>
    // GitHub Pages 可能是「项目站点」（http://user.github.io/<repo>/），
    // 也可能是「用户站点」（http://user.github.io/）。这里根据当前路径自动判断，
    // 这样以后仓库改名或迁移到用户站点，本页链接依然有效。
    (function () {
      var segs = location.pathname.split('/').filter(Boolean);
      var base = segs.length ? '/' + segs[0] + '/' : '/';
      document.getElementById('homeLink').setAttribute('href', base);
      document.getElementById('repoHint').textContent = 'github.com/' + location.hostname.split('.')[0] + base.replace(/\//g, '');
    })();
  </script>
</body>
</html>
