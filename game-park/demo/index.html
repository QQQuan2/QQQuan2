<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏乐园 · 在线试玩</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232C3E50'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23E67E22'/%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1a1d24; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; padding: 16px;
    }
    p.tip { color: #8b93a3; font-size: 13px; margin-bottom: 14px; }
    p.tip a { color: #6ca0ff; text-decoration: none; }

      border-radius: 22px; border: 6px solid #2c3140; overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,.5); line-height: 0;
    }
    canvas { max-height: 78vh; width: auto; display: block; touch-action: none; background: #2C3E50; }
  </style>
</head>

  <p class="tip">浏览器模拟版（Canvas + wx 适配层）· 源码：<a href="https://github.com/QQQuan2/InventoRY/tree/main/game-park/minigame">minigame/</a> · 存档保存在本地 localStorage</p>
  <div class="phone"><canvas id="game"></canvas></div>
  <script src="./wx-shim.js"></script>
  <script src="./bundle.js"></script>
</body>
</html>
